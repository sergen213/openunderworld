# Unsigned test AppImage for every push to main and every tag, uploaded as a workflow artifact.
# CI holds no signing key: official signed releases (manifest.json + .sig, GitHub release) are made
# locally with tools/release.sh. See docs/RELEASING.md.
name: appimage
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags for git describe
      # Same Ubuntu 24.04 image (packaging/appimage/Containerfile) as tools/release.sh: glibc floor in the log ("== floor:").
      - name: Build AppImage
        run: OU_JOBS=4 packaging/appimage/build-in-container.sh build-appimage/out
      - name: Smoke test in a clean Ubuntu 24.04 container
        run: packaging/appimage/smoke-in-container.sh build-appimage/out/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: OpenUnderworld-AppImage-${{ github.sha }}
          path: build-appimage/out/*
          if-no-files-found: error
